name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores ficticios y no secretos: el build no necesita llaves reales.
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-dummy-site-key
      CONTYGO_API_KEY: ci-dummy-not-a-secret
      LANDING_TOKEN_SECRET: ci-dummy-token-secret-0123456789abcdef0123
      TURNSTILE_SECRET_KEY: ci-dummy-not-a-secret
      GEMINI_API_KEY: ci-dummy-not-a-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx next build
